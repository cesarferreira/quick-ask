[workspace]
members = ["crates/quick-ask-core", "crates/quick-ask-app"]
default-members = ["crates/quick-ask-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"

[profile.dev]
debug = 0

[profile.release]
opt-level = 2
strip = "debuginfo"
