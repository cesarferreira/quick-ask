[package]
name = "quick-ask"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A small, native keyboard-first ChatGPT launcher for macOS"

[dependencies]
quick-ask-core = { path = "../quick-ask-core" }
anyhow.workspace = true
reqwest.workspace = true
base64 = "0.22"
futures-channel = "0.3"
futures-lite = "2"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
sha2 = "0.10"
gif = "=0.14.2"
image-webp = "=0.2.4"
serde_json.workspace = true
dirs.workspace = true
gpui = { version = "=0.2.2", default-features = false }
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
global-hotkey = "0.9"
tray-icon = "0.24"
open = "5"
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication", "NSWorkspace", "NSScreen", "NSWindow", "NSGlassEffectView", "NSColor", "NSView", "NSAppearance", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = "0.3"
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }

